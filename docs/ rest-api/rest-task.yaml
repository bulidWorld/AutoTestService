    Run:
      type: object
      description: 任务运行摘要；固定参数初始化 → 主流程 → 全部清理 → 终态。清理结束前保持 running 和运行互斥。主流程失败或阻塞保留 primary_error；阻塞且清理无失败时终态 blocked；清理失败终态 failed，仅清理失败时顶层 CLEANUP_FAILED。未配置清理为
        skipped，整体耗时包括等待、排队与清理。
      properties:
        id:
          type: integer
          description: 运行 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        task_id:
          type: integer
          description: 任务 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        project_id:
          type: integer
          description: 项目 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        status:
          type: string
          description: 运行状态
          example: queued
          enum:
          - queued
          - running
          - succeeded
          - failed
          - blocked
        created_at:
          type: string
          description: 接受运行时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
        started_at:
          type: string
          description: 开始时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
        finished_at:
          type: string
          description: 结束时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          description: 耗时毫秒，未结束为 null
          example: null
          format: int64
          nullable: true
          minimum: 0
        error_code:
          type: string
          description: 错误分类：HTTP_STATUS_ERROR、CONNECTION_ERROR、TIMEOUT、RESPONSE_NOT_JSON、EXTRACTION_NOT_FOUND、EXTRACTION_TYPE_ERROR、ASSERTION_FAILED、ASSERTION_EXECUTION_ERROR、ASSERTION_RETURN_TYPE_ERROR、EXECUTION_INTERRUPTED。
            新增 INVALID_STEP_STRUCTURE、RAW_BODY_CONFLICT、PARAMETER_NOT_AVAILABLE、PARALLEL_FAILED、PARALLEL_ABORTED、CLEANUP_INPUT_UNAVAILABLE、CLEANUP_FAILED、UPSTREAM_FAILED。已接受运行的失败从查询返回。
          example: null
          nullable: true
        error_message:
          type: string
          description: 脱敏错误说明
          example: null
          nullable: true
        execution_stage:
          type: string
          description: 当前执行阶段；queued 初始为 main，全部结束为 finished。
          example: main
          enum:
          - main
          - finally
          - finished
        primary_error:
          type: object
          nullable: true
          description: 主流程第一失败原因；清理失败不覆盖，主流程成功时为 null。
          properties:
            code:
              type: string
              description: 主流程错误分类。
              example: PARALLEL_FAILED
            message:
              type: string
              description: 不包含并发响应内容的错误摘要。
              example: 并发节点失败
          required:
          - code
          - message
          additionalProperties: false
          example: null
        cleanup_status:
          type: string
          description: 清理状态；无 finally 为 skipped。
          example: pending
          enum:
          - pending
          - running
          - succeeded
          - failed
          - skipped
