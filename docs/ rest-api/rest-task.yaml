    post:
      operationId: startTaskStepRerun
      tags:
      - 任务运行
      summary: 重复执行单个已执行步骤
      description: 设计契约，处理器待实现。无请求体，不接受参数覆盖。仅允许已结束任务运行中 succeeded/failed/blocked 且具备完整实际输入快照的 rest/wait/compute/sql 叶子；skipped、pending、running
        及 parallel 父节点不允许。复用源步骤执行前的实际值、已构造请求、动态等待值及表达式求值时间，不重新全局解析、提取或生成鉴权。只执行目标步骤，不执行前置、后续或 finally；输出仅保存至独立记录，不回写原运行或任务组。每次
        POST 创建一条新记录并可能再次产生业务副作用；同任务活动执行互斥，共享现有调度和 HTTP 槽位。
      parameters:
      - &rerun_path_001
        $ref: '#/components/parameters/ProjectId'
      - &rerun_path_002
        $ref: '#/components/parameters/TaskId'
      - &rerun_path_003
        $ref: '#/components/parameters/RunId'
      - &rerun_path_004
        $ref: '#/components/parameters/RunStepId'
      responses:
        '202':
          description: 成功接受独立步骤执行。
