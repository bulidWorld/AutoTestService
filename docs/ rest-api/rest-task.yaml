    PollPolicy:
      type: object
      additionalProperties: false
      description: REST 专用。立即发送并按断言或 HTTP 2xx 判定成功；仅 HTTP_STATUS_ERROR/ASSERTION_FAILED 重试，达到上限为 POLL_EXHAUSTED。只发布最终响应提取，统计为一个逻辑 REST 节点。
      properties:
        max_attempts:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
        interval_milliseconds:
          type: integer
          minimum: 1
          maximum: 3600000
          default: 1000
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 60
    SqlPolicy:
      type: object
      additionalProperties: false
      description: 仅 SQL 节点使用。连接配置随任务保存；错误信息不回显凭据。SQL 不做插值，不提取查询结果；不要使用事务控制语句。
      required: [driver, datasource, statement]
      properties:
        driver:
          type: string
          enum: [postgresql, sqlite]
        datasource:
          type: string
          minLength: 1
          description: PostgreSQL libpq 连接串或 URI；SQLite 文件路径。
        username:
          type: string
        password:
          type: string
        statement:
          type: string
          minLength: 1
        parameters:
          type: array
          maxItems: 100
          description: 顺序引用已可用全局参数，PostgreSQL 使用 %s、SQLite 使用 ? 驱动绑定；只接受标量或 null。
          items:
            type: string
            minLength: 1
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
    ExecutionOptions:
      type: object
      description: 显式节点执行策略；对应 XML 的 auth、taskStep 条件属性、updateParam、wait 动态属性、rawPath/rawQuery、compute、sql 和 rest/poll。未知键拒绝。
      additionalProperties: false
      properties:
        poll:
          $ref: '#/components/schemas/PollPolicy'
        sql:
          $ref: '#/components/schemas/SqlPolicy'
        timezone:
          type: string
          minLength: 1
          default: Asia/Shanghai
          description: compute 专用 IANA 时区；不使用宿主机时区。now/today 使用该时区，HTTP-date 固定输出 GMT。
        expressions:
          type: array
          minItems: 1
          maxItems: 100
          description: compute 专用，名称须对应 expression_source 为本节点的参数。支持 concat 字符串拼接及 str 标量转换、白名单日期函数和有界数值四则运算；param 只接受字面参数名，同节点输出不可互引。
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              expression:
                type: string
                minLength: 1
                maxLength: 2000
            required:
            - name
            - expression
        auth:
          type: object
          description: 逐步鉴权；none 不带 Authorization；bearer 生成 Bearer 前缀头，二者与显式 Authorization 互斥。header 模式要求恰好一个显式 Authorization，仅豁免该头的接口 Schema，覆盖伪造、空值或错误格式鉴权；仍禁止换行。
          additionalProperties: false
          properties:
            mode:
              type: string
              enum:
              - none
              - bearer
              - header
            parameter:
              type: string
              minLength: 1
          required:
          - mode
        condition:
          type: object
          description: 条件不满足时默认 skip；blocked 表示前提不足，停止主流程并执行 finally。ifValue 对应 value，支持 JSON 标量/数组/对象/null。
          additionalProperties: false
          properties:
            parameter:
              type: string
              minLength: 1
            operator:
              type: string
              enum:
              - notEmpty
              - present
              - equals
              - truthy
              default: notEmpty
            value:
              nullable: true
            on_false:
              type: string
              enum:
              - skip
              - blocked
              default: skip
          required:
          - parameter
        assignments:
          type: array
          description: 更新已声明的参数；沿用目标 value_type，未提取到值覆盖为 null。并发兄弟不能写同名参数。对应 XML updateParam。
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              extract_expression:
                type: string
                minLength: 1
            required:
            - name
            - extract_expression
        wait:
          type: object
          description: 仅 wait。与 wait_milliseconds 二选一；duration 为相对等待，until 为绝对到期时刻。计算 base + offset_parameter + offset_milliseconds，until
            再减当前 UTC。过去时刻立即完成，单次最多 30 天。
          additionalProperties: false
          properties:
            parameter:
              type: string
              minLength: 1
            mode:
              type: string
              enum:
              - duration
              - until
              default: duration
            unit:
              type: string
              enum:
              - seconds
              - milliseconds
              - iso8601
              default: seconds
            offset_milliseconds:
              type: integer
              minimum: -2592000000
              maximum: 2592000000
              default: 0
            offset_parameter:
              type: string
              minLength: 1
            offset_unit:
              type: string
              enum:
              - seconds
              - milliseconds
              default: seconds
          required:
          - parameter
        raw_path:
          type: string
          description: 显式负向路径，含前导 /，相对于 base_url 路径前缀；保留 ASCII 原文，不插值或再次编码。绕过 path Schema/必填校验，不能同时有 path bindings；禁止问号、井号、空白及控制字符。
        raw_query:
          type: string
          description: 显式负向查询，不带前导 ?；空串表示省略所有 query。保留 ASCII 原文、不插值或再次编码；绕过 query Schema/必填校验，不能同时有 query bindings；禁止井号、空白及控制字符。
    BusinessAssertionCode:
      type: string
      nullable: true
      maxLength: 16000
      description: |
        可选的业务成功断言完整代码，包含方法名和函数定义，入口格式必须为 def assert_response(responseBody, globalParam, statusCode, headers):，必须返回 boolean（true/false，示例代码使用 True/False）。
        省略、null、空字符串或仅空白表示未设置；完整保存时未设置即清除原有断言，按 HTTP 200～299 判断请求成功。
        设置后，在响应完整读取后、独立提取当前步骤的 REST 参数并调用断言（断言读取步骤执行前的参数快照），以其返回值替代 HTTP 状态码成功判定；非 2xx 响应也执行断言。
        statusCode 为真实 HTTP 状态码整数，不能用 responseBody 的业务 code 代替；headers 为小写响应头名到字符串列表的映射，保留重复头顺序，缺失的头不在映射中，例如 headers.get("content-type", [])。
        responseBody 为 JSON 解析后的响应体，支持对象、数组和 JSON 标量；空响应或非 JSON 时传入 None，仍可核对状态及响应头。参数独立提取，字段缺失、类型不匹配或无可用 JSON 时赋 null，不受断言结果影响。
        globalParam 为参数名称到运行值的映射，只包含当前步骤执行前已成功赋值的全局参数，不包含当前或后续步骤尚未提取的参数。
        返回 True 表示业务断言通过，False 以 ASSERTION_FAILED 失败；执行异常以 ASSERTION_EXECUTION_ERROR 失败，非布尔返回值以 ASSERTION_RETURN_TYPE_ERROR 失败。
        连接失败或超时仍直接失败，不调用断言；该步骤关联参数仍独立赋原值或 null；断言失败时也发布，供 finally 清理使用。
        保存和运行前静态校验完整函数定义及入口签名，不执行断言；可 raise Blocked(...) 表示前提不足，终态为 blocked，仍尝试 finally；无效配置返回 400，issues 定位 steps 数组对应项的 assertion_code。
        使用标准 Python 函数入口 assert_response；不支持 def assert（assert 为保留字）。
        最多 16000 字符，顶层仅允许函数定义；支持同步 Python 计算、循环、条件与常用内置函数，不支持导入模块、类、私有属性、装饰器、类型注解和默认参数。
        在独立进程中执行，CPU 上限 2 秒、总等待上限 3 秒、内存上限 256 MiB；超限按 ASSERTION_EXECUTION_ERROR 失败，返回异常类型及函数/行号堆栈，不返回异常原文、源码或局部变量。
      example: |
        def assert_response(responseBody, globalParam, statusCode, headers):
            return statusCode == 200 and responseBody.get("code") == 0 and responseBody.get("data", {}).get("id") == globalParam["expected_id"]
    StepInput:
      description: 按 step_type 区分节点；position 为同一 execution_scope、同一父节点下唯一的正 int32，允许间断。父只能是本任务 main 根 parallel，子节点只能是
        main rest/wait/compute/sql；finally 只能包含根 rest/wait/compute/sql。禁止自引用、跨任务、循环、嵌套并发，总节点最多 1000。
      oneOf:
      - $ref: '#/components/schemas/SqlStepInput'
      - $ref: '#/components/schemas/ComputeStepInput'
      - $ref: '#/components/schemas/RestStepInput'
      - $ref: '#/components/schemas/WaitStepInput'
      - $ref: '#/components/schemas/ParallelStepInput'
      example:
        step_type: rest
        execution_scope: main
        position: 10
        interface_id: 1
        file_id: 1
        version: 1
        bindings: []
        headers: []
    Step:
      description: 按 step_type 区分节点；position 为同一 execution_scope、同一父节点下唯一的正 int32，允许间断。父只能是本任务 main 根 parallel，子节点只能是
        main rest/wait/compute/sql；finally 只能包含根 rest/wait/compute/sql。禁止自引用、跨任务、循环、嵌套并发，总节点最多 1000。
      oneOf:
      - $ref: '#/components/schemas/SqlStep'
      - $ref: '#/components/schemas/ComputeStep'
      - $ref: '#/components/schemas/RestStep'
      - $ref: '#/components/schemas/WaitStep'
      - $ref: '#/components/schemas/ParallelStep'
      example:
        step_type: rest
        execution_scope: main
        position: 10
        id: 1
        parent_step_id: null
        interface_id: 1
        file_id: 1
        version: 1
        bindings: []
        headers: []
        file_name: 订单接口
        current_version: 2
        has_new_version: true
        method: GET
        path: /orders/{id}
        execution_phase: steps
    TaskWrite:
      type: object
      description: 原子保存完整执行树及参数。steps 数组仅定义临时 step_index，不决定调度顺序；先建立全部节点 ID，再映射 parent_step_index 与 rest_source.step_index。读取仅返回稳定
        parent_step_id，根为 null。固定值先初始化，main 按树及 position 执行；parallel 子节点读取同一输入快照，不能互相依赖，已启动子节点收尾后一次发布赋值（含 null），失败不阻止发布。参数名唯一，来源仅允许 main
        REST 叶子。草稿可声明需要严格前序任务组批次继承的输入；启动须证明输入可用。bindings、headers 和断言均纳入依赖分析；finally 仅校验声明、类型与来源，运行时缺失输入则失败并继续后续清理。保存禁止修改
        queued/running 或活动组预约任务。
      properties:
        name:
          type: string
          description: 项目内唯一名称，去除首尾空白
          example: 订单流程
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: 任务描述
          example: 订单回归
          maxLength: 2000
          default: ''
        base_url:
          type: string
          description: HTTP/HTTPS 地址，可带路径前缀，禁止 query、fragment 和用户凭据
          example: https://api.example.com/service
        timeout_seconds:
          type: integer
          description: 每次请求超时秒数
          example: 30
          minimum: 1
          maximum: 300
          default: 30
        global_parameters:
          type: array
          description: 名称唯一的 fixed/function/rest/expression 参数；function 在 task 初始化时调用 generateUUID()，fixed 始终为字面量；REST 来源可为 main/finally REST；expression 来源为 compute。wait/parallel 父节点不能作为参数来源；finally 产出供后续清理引用。
          items:
            $ref: rest-parameter.yaml#/components/schemas/GlobalParameterEdit
          example: []
        steps:
          type: array
          description: 扁平节点数组；树由 parent_step_id/parent_step_index 表示，调度按 scope、父子关系及 position；读取仅含稳定父 ID。
          items:
            $ref: '#/components/schemas/StepInput'
          example: []
          maxItems: 1000
      required:
      - name
      - base_url
      - global_parameters
      - steps
      example:
        name: 订单流程
        base_url: https://api.example.com/service
        timeout_seconds: 30
        global_parameters: []
        steps: []
      additionalProperties: false
    Task:
      type: object
      description: 任务配置与完整节点树，REST 版本提示不自动切换；敏感绑定脱敏，raw_body.text 原文返回。
      properties:
        name:
          type: string
