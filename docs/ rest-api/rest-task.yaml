components:
  examples:
    TaskCapabilities:
      summary: compute 拼接、SQL 参数绑定和 REST 轮询（接口 ID 须替换为项目中 GET /orders/{id} 的实际值）
      value:
        name: 拼接、SQL绑定与轮询
        base_url: http://127.0.0.1:8081
        global_parameters:
        - name: order_id
          source_type: fixed
          value_type: integer
          value: 42
        - name: label
          source_type: expression
          value_type: string
          expression_source:
            step_index: 0
        steps:
        - step_type: compute
          execution_scope: main
          position: 10
          options:
            expressions:
            - name: label
              expression: concat("order-", str(param("order_id")))
        - step_type: sql
          execution_scope: main
          position: 20
          options:
            sql:
              driver: sqlite
              datasource: /tmp/task-orders.db
              statement: UPDATE orders SET label = ? WHERE id = ?
              parameters:
              - label
              - order_id
        - step_type: rest
          execution_scope: main
          position: 30
          file_id: 1
          interface_id: 1
          version: 1
          bindings:
          - location: path
            name: id
            binding:
              kind: global
              parameter_name: order_id
          headers: []
          assertion_code: "def assert_response(responseBody, globalParam, statusCode, headers):\n    return\
            \ statusCode == 200 and responseBody.get(\"status\") == \"ready\""
          options:
            poll:
              max_attempts: 10
              interval_milliseconds: 1000
              timeout_seconds: 60
  schemas:
    StepRerun:
      type: object
      description: 独立步骤重复执行记录；输入快照不对外暴露。
      properties:
        id:
          type: integer
          description: 重复执行记录 ID
          example: 1
          format: int32
        source_run_id:
          type: integer
          description: 原任务运行 ID
          example: 1
          format: int32
        source_run_step_id:
          type: integer
          description: 原步骤运行 ID；不是配置 step_id
          example: 2
          format: int32
        run_uuid:
          type: string
          description: 本次独立执行的日志关联 UUID
          example: c637501b-ad55-41dd-9b4b-92fa51c496a8
          format: uuid
        status:
          type: string
          description: 独立执行状态
          example: queued
          enum:
          - queued
          - running
          - succeeded
          - failed
          - blocked
        step_type:
          type: string
          description: 目标叶子类型
          example: rest
          enum:
          - rest
          - wait
          - compute
        created_at:
          type: string
          description: 接受时间
          example: '2026-10-22T02:00:00Z'
          format: date-time
        started_at:
          type: string
          description: 开始时间；排队中为空
          example: null
          format: date-time
          nullable: true
        finished_at:
          type: string
          description: 结束时间；未结束为空
          example: null
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          description: 执行墙钟耗时；未结束或 parallel 内叶子为空
          example: null
          format: int64
          nullable: true
        error_code:
          type: string
          description: 失败分类；成功或未失败为空
          example: null
          nullable: true
        error_message:
          type: string
          description: 脱敏失败摘要
          example: null
          nullable: true
        output_parameters:
          type: object
          description: 本次产生的参数赋值，仅保存到本记录，不发布到原上下文
          example: &rerun_schema_001 {}
          additionalProperties: true
        request_result:
          type: object
          description: parallel 外 REST 的脱敏请求响应；其他类型及 parallel 内叶子为空。请求不写入原 task_requests。
          nullable: true
          properties:
            method:
              type: string
              description: HTTP 方法
              example: POST
            url:
              type: string
              description: 脱敏实际 URL
              example: https://api.example.com/orders
            status_code:
              type: integer
              description: 无完整响应时为空
              example: 200
              nullable: true
            response_headers:
              type: array
              description: 脱敏响应头列表
              example: []
              items:
                type: object
                description: 名称和值
                additionalProperties: true
                example:
                  name: Content-Type
                  value: application/json
            response_body:
              type: string
              description: 脱敏且沿用现有大小上限的响应文本
              example: null
              nullable: true
          example: null
      required:
      - id
      - source_run_id
      - source_run_step_id
      - run_uuid
      - status
      - step_type
      - created_at
      - started_at
      - finished_at
      - duration_ms
      - error_code
      - error_message
      - output_parameters
      - request_result
      example:
        id: 1
        source_run_id: 1
        source_run_step_id: 2
        run_uuid: c637501b-ad55-41dd-9b4b-92fa51c496a8
        status: queued
        step_type: rest
        created_at: '2026-10-22T02:00:00Z'
        started_at: null
        finished_at: null
        duration_ms: null
        error_code: null
        error_message: null
        output_parameters: *rerun_schema_001
        request_result: null
    StepRerunPage:
      type: object
      description: 步骤重复执行历史分页。
      properties:
        items:
          type: array
          description: 本页执行记录
          items:
            $ref: '#/components/schemas/StepRerun'
          example: []
        total:
          type: integer
          description: 记录总数
          example: 0
        page:
          type: integer
          description: 当前页
          example: 1
        page_size:
          type: integer
          description: 每页条数
          example: 20
      required:
      - items
      - total
      - page
      - page_size
      example:
        items: []
        total: 0
        page: 1
        page_size: 20
    Error:
      type: object
      description: 统一错误响应；不暴露内部堆栈、密码或 Token。业务接口使用 code 和 issues 提供定位信息，系统基础接口至少返回
        detail。
      required:
      - detail
      properties:
        detail:
          type: string
          description: 错误说明
          example: 内部服务错误
        code:
          type: string
          description: 稳定错误码，例如 PROJECT_NAME_CONFLICT、INVALID_YAML、UNSUPPORTED_SCHEMA、RESOURCE_NOT_FOUND。
          example: INVALID_YAML
        issues:
          type: array
          description: 字段级错误明细，没有字段错误时为空。
          example:
          - location: /paths/~1orders/post/requestBody
            reason: 暂不支持 text/plain 请求体
          items:
            $ref: '#/components/schemas/ValidationIssue'
      example:
        detail: YAML 校验失败
        code: UNSUPPORTED_SCHEMA
        issues:
        - location: /paths/~1orders/post/requestBody
          reason: 暂不支持 text/plain 请求体
    ValidationIssue:
      type: object
      description: 单项校验问题，API 定位 steps 数组字段，XML 定位具体 XPath/行号及原因。
      example:
        location: /paths/~1orders/post/requestBody
        reason: 暂不支持 text/plain 请求体
      properties:
        location:
          type: string
          description: API 如 steps[2].parent_step_index；XML 如 /task/taskStep[@order="30"]/parallel/taskStep[@order="2"]/rest/rawBody，可包含行号。
          example: /paths/~1orders/post/requestBody
        reason:
          type: string
          description: 可读错误原因，不包含凭据或内部堆栈。
          example: 暂不支持 text/plain 请求体
      required:
      - location
      - reason
    SqlStepInput:
      type: object
      description: SQL 节点；独立事务，成功提交、失败回滚，不产生 HTTP 请求或输出参数。
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/ExecutionOptions'
          - required:
            - sql
        id:
          type: integer
          description: 已有步骤稳定 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        step_type:
          type: string
          description: 节点类型。
          example: sql
          enum:
          - sql
        execution_scope:
          type: string
          description: 主流程或清理流程；sql 可作为 main parallel 的叶子。
          example: main
          enum:
          - main
          - finally
        position:
          type: integer
          description: 兄弟排序值；不由 steps 数组顺序推导。
          example: 10
          format: int32
          minimum: 1
          maximum: 2147483647
        parent_step_id:
          type: integer
          description: 稳定 parallel 父节点 ID；根节点读取为 null，写入时省略。
          example: null
          format: int32
          minimum: 1
          maximum: 2147483647
          nullable: true
        parent_step_index:
          type: integer
          description: 本次完整 steps 数组的父下标，从 0 开始；与 parent_step_id 二选一，仅写入支持。
          example: 0
          minimum: 0
          maximum: 999
      required:
      - step_type
      - execution_scope
      - position
      - options
      additionalProperties: false
    ComputeStepInput:
      type: object
      description: 运行时受限表达式节点，不发 HTTP；实际执行时捕获一个 now，所有表达式共享时刻与节点前参数快照，全部计算成功才发布。支持 main、finally 及 parallel 子节点。
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/ExecutionOptions'
          - required:
            - expressions
        id:
          type: integer
          description: 已有步骤稳定 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        step_type:
          type: string
          description: 节点类型。
          example: compute
          enum:
          - compute
        execution_scope:
          type: string
          description: 主流程或清理流程；compute 可作为 main parallel 的叶子。
          example: main
          enum:
          - main
          - finally
        position:
          type: integer
          description: 兄弟排序值；不由 steps 数组顺序推导。
          example: 10
          format: int32
          minimum: 1
          maximum: 2147483647
        parent_step_id:
          type: integer
          description: 稳定 parallel 父节点 ID；根节点读取为 null，写入时省略。
          example: null
          format: int32
          minimum: 1
          maximum: 2147483647
          nullable: true
        parent_step_index:
          type: integer
          description: 本次完整 steps 数组的父下标，从 0 开始；与 parent_step_id 二选一，仅写入支持。
          example: 0
          minimum: 0
          maximum: 999
      required:
      - step_type
      - execution_scope
      - position
      - options
      additionalProperties: false
      example:
        step_type: compute
        execution_scope: main
        position: 10
        options:
          timezone: Asia/Shanghai
          expressions:
          - name: EXPIRES
            expression: http_date(add_seconds(now(), 3600))
    SqlStep:
