# Design-first: 阶段二契约，业务实现前先维护此文件。
openapi: 3.0.3
info:
  title: AutoTestService Task API
  version: 0.4.0
  description: 统一任务节点配置与执行查询契约；支持 REST 轮询、等待、compute 拼接及日期表达式、SQL 参数绑定、单层并发屏障与任务级 finally。直接采用新模型，不兼容旧步骤或 location=header 绑定。配置保存和启动前静态校验，执行中的业务失败通过运行查询返回。raw_body
                 原文不脱敏，其余敏感值沿用既有脱敏规则。
paths:
  /api/v1/projects/{project_id}/tasks:
    get:
      operationId: listTasks
      tags:
      - 任务管理
      summary: 任务列表
      description: 按名称不区分大小写包含搜索，按 updated_at 降序、id 升序分页。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: query
        description: 名称包含搜索，空字符串不筛选。
        schema:
          type: string
          description: 搜索词
          example: 订单
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTask
      tags:
      - 任务管理
      summary: 创建任务
      description: 原子保存参数与执行树；支持 compute 字符串拼接、SQL 驱动参数绑定及 REST 轮询。配置保存不求值、不连接 SQL 数据源、不发送业务请求。草稿允许无步骤。steps 数组仅定义临时下标，调度按 position 与父子关系。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '201':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 原子保存完整执行树及参数。steps 数组仅定义临时 step_index，不决定调度顺序；先建立全部节点 ID，再映射 parent_step_index 与 rest_source.step_index。读取仅返回稳定
                       parent_step_id，根为 null。固定值先初始化，main 按树及 position 执行；parallel 子节点读取同一输入快照，不能互相依赖，已启动子节点收尾后一次发布赋值（含 null），失败不阻止发布。参数名唯一，来源允许 main/finally REST 或 compute
                       叶子。草稿可声明需要严格前序任务组批次继承的输入；启动须证明输入可用。bindings、headers 和断言均纳入依赖分析；finally 仅校验声明、类型与来源，运行时缺失输入则失败并继续后续清理。保存禁止修改 queued/running
                       或活动组预约任务。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
            examples:
              extendedCapabilities:
                $ref: '#/components/examples/TaskCapabilities'
  /api/v1/projects/{project_id}/tasks/import:
    post:
      operationId: importTask
      tags: [任务管理]
      summary: 导入 XML 任务
      description: 单文件 XML 上限 5 MiB，一次最多上传 100 个文件，禁止 DTD/实体/外部引用；按新 XSD 接收 rest/wait/compute/sql/parallel 与 finally。main 前序展开后再展开
        finally，order 原值保存为 position；独立 pathParams/queryParams/body 转为对应 bindings，header 转为 headers，拒绝 kv location 及旧 header 绑定。rawBody 存在即启用且保留
        解析后原文。按同项目当前版本 method/path 唯一匹配接口，固定版本；保存复用树形校验，不发 HTTP。整批原子导入：任一文件失败则全部回滚。格式/结构/依赖错误 400 并返回
        具体文件序号、XPath/行号与原因，缺项目 404，任一文件同名 409，超限 413，成功 201 按上传顺序返回任务数组。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        description: 上传 1-100 个各不超过 5 MiB 的 XML 文件，并指定任务运行地址。
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, base_url]
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                  description: 符合 docs/task.xsd 的 .xml 文件，可一次上传多个，禁止 DTD 和实体。
                base_url:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  description: 无凭据、query 或 fragment 的 HTTP/HTTPS 运行地址。
                  example: https://api.example.com
              example: {file: [task.xml, task2.xml], base_url: 'https://api.example.com'}
      responses:
        '201':
          description: 整批原子创建成功，按上传顺序返回脱敏任务详情数组。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: 某个 XML 文件、接口匹配或任务配置无效，整批回滚。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 项目不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名称冲突，整批回滚。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 某个文件超过 5 MiB。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}:
    get:
      operationId: getTask
      tags:
      - 任务管理
      summary: 任务详情
      description: 返回参数、步骤、完整 options（含 expressions/sql.parameters/poll）、文件名、固定版本、方法及路径；表达式来源使用稳定 step_id，发现新版本仅提示。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTask
      tags:
      - 任务管理
      summary: 保存任务及步骤排序
      description: 完整替换配置，支持修改 compute 表达式、options.sql.parameters 和 options.poll；保留已有节点 ID、新节点分配 ID。省略的旧节点会删除，省略的可选策略会清除，运行历史快照不变。按项目 → 任务组 → 任务锁序，queued/running（含清理）或活动组预约时禁止修改，返回 409。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 原子保存完整执行树及参数。steps 数组仅定义临时 step_index，不决定调度顺序；先建立全部节点 ID，再映射 parent_step_index 与 rest_source.step_index。读取仅返回稳定
                       parent_step_id，根为 null。固定值先初始化，main 按树及 position 执行；parallel 子节点读取同一输入快照，不能互相依赖，已启动子节点收尾后一次发布赋值（含 null），失败不阻止发布。参数名唯一，来源允许 main/finally REST 或 compute
                       叶子。草稿可声明需要严格前序任务组批次继承的输入；启动须证明输入可用。bindings、headers 和断言均纳入依赖分析；finally 仅校验声明、类型与来源，运行时缺失输入则失败并继续后续清理。保存禁止修改 queued/running
                       或活动组预约任务。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
            examples:
              extendedCapabilities:
                $ref: '#/components/examples/TaskCapabilities'
    delete:
      operationId: deleteTask
      tags:
      - 任务管理
      summary: 删除任务
      description: confirm=true 代表页面二次确认。事务内锁定任务行检查 queued/running、活动任务组预约及任务组配置引用。先移除任务组配置引用才能删除；保留任务组成员运行历史，清理其余请求、运行参数、运行步骤、运行、任务步骤、参数及任务。
        当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/copy:
    post:
      operationId: copyTask
      tags:
      - 任务管理
      summary: 复制任务
      description: 复制到同一项目，重建全部任务、节点 ID，同时重映射 parent_step_id 与 rest_source.step_id；保留 headers、raw_body、等待、并发、清理及版本绑定，不复制运行历史或预览值。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '201':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 复制到同一项目，重建全部任务、节点 ID，同时重映射 parent_step_id 与 rest_source.step_id；保留 headers、raw_body、等待、并发、清理及版本绑定，不复制运行历史或预览值。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTask'
  /api/v1/projects/{project_id}/tasks/{task_id}/deletion-preview:
    get:
      operationId: previewTaskDeletion
      tags:
      - 任务管理
      summary: 删除影响预览
      description: 显示关联运行及请求数量；有未结束运行、被活动任务组预约或被任务组配置引用时禁止删除。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionPreview'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/validate:
    post:
      operationId: validateTask
      tags:
      - 任务管理
      summary: 校验任务
      description: 仅静态校验统一执行树；save 允许待继承任务组输入，run 必须证明本任务输入已发布可用。并发子节点从同一输入集合分析，禁止兄弟互相依赖；headers、bindings、断言均参与校验。finally 仅校验参数声明、类型及来源合法性。错误
        400 并定位 steps 字段，不发 HTTP。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 校验已保存配置；save 允许无步骤，run 至少一个步骤。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTask'
  /api/v1/projects/{project_id}/tasks/{task_id}/runs:
    post:
      operationId: startTaskRun
      tags:
      - 任务运行
      summary: 运行任务
      description: 树形静态校验失败返回 400，不创建运行、不执行清理。事务创建不可变快照、全部运行节点和参数结果，第二遍映射运行父 ID。接受返回 202，执行业务失败由运行查询返回。服务最多八个活动任务，全部独立任务、组成员、并发及清理共享八个
        HTTP 槽位；单请求 timeout 不限制 wait/parallel。主流程失败等待已启动并发子节点收尾，再尝试全部 finally；清理期间保持 running、运行互斥与任务组预约。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listTaskRuns
      tags:
      - 任务运行
      summary: 运行历史
      description: 按 created_at 降序、id 降序分页；任务或 YAML 更新不改变历史。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        description: 可选状态筛选。
        schema:
          type: string
          description: 运行状态
          example: queued
          enum:
          - queued
          - running
          - succeeded
          - failed
          - blocked
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/runs/{run_id}:
    get:
      operationId: getTaskRun
      tags:
      - 任务运行
