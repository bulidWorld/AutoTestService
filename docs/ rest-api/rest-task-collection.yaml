openapi: 3.0.3
info:
  title: AutoTestService Task Collection API
  version: 0.1.0
  description: 项目级多任务组管理、批次执行、共享参数与运行查询契约。默认应用加载并显式绑定业务实现。 成员复用统一任务执行树；单层 parallel 与项目级批次分别调度，共享服务级八个 HTTP 槽位，最多八个活动任务。
paths:
  /api/v1/projects/{project_id}/task-collections:
    get:
      operationId: listTaskCollections
      tags:
      - 任务组
      summary: 查询任务组
      description: 按 updated_at 降序、id 升序分页。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: rest-task.yaml#/components/parameters/Page
      - $ref: rest-task.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
    post:
      operationId: createTaskCollection
      tags:
      - 任务组
      summary: 创建任务组
      description: 锁定项目行，校验项目内名称唯一、成员归属及重复任务。
      parameters:
      - $ref: '#/components/parameters/project_id'
      responses:
        '201':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
      requestBody:
        required: true
        description: 完整任务组配置，原子保存。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionInput'
  /api/v1/projects/{project_id}/task-collections/{collection_id}:
    get:
      operationId: getTaskCollection
      tags:
      - 任务组
      summary: 查询任务组
      description: 返回配置及按批次排序的成员。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
    put:
      operationId: updateTaskCollection
      tags:
      - 任务组
      summary: 完整替换任务组
      description: 事务锁定项目、任务组、成员任务；活动组运行期间拒绝修改。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
      requestBody:
        required: true
        description: 完整任务组配置，原子保存。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionInput'
    delete:
      operationId: deleteTaskCollection
      tags:
      - 任务组
      summary: 删除任务组
      description: 必须 confirm=true；有活动组运行返回 409；仅删除配置及成员，保留任务和全部运行历史。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      - $ref: rest-task.yaml#/components/parameters/ConfirmDelete
      responses:
        '204':
          description: 删除成功，响应体为空。
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
  /api/v1/projects/{project_id}/task-collections/{collection_id}/runs:
    post:
      operationId: startTaskCollectionRun
      tags:
      - 任务组
      summary: 运行任务组
      description: 执行成员完整任务树；启动先校验 main/finally、并发屏障及严格前序批次输入依赖，不允许同批互读或并发兄弟互读。按项目 → 任务组 → 任务 ID 升序加锁，预建组运行、成员运行及快照。成员 primary_error
        持久化或 cleanup_status 首次失败即停止本批尚未启动成员；已启动成员继续主流程和全部清理，全部达到终态后才判定批次。仅主流程与清理全成功才允许按 task_id 升序合并输出，任一失败整批不发布且跳过后续批次；清理 REST 可提取参数，成员及批次最终成功后，与其他已发布参数一并合并并按现有规则记录覆盖审计。成员及独立任务、parallel
        和 finally 共享服务级八个 HTTP 槽位，最多八个活动任务。活动预约保留至所有已启动成员清理结束；服务中断不续跑、不补发清理。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      responses:
        '202':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
    get:
      operationId: listTaskCollectionRuns
      tags:
      - 任务组
      summary: 查询任务组运行历史
      description: 按 created_at 降序、id 升序分页；组删除后仍可按历史来源 ID 查询，不要求活跃组存在。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      - $ref: rest-task.yaml#/components/parameters/Page
      - $ref: rest-task.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
  /api/v1/projects/{project_id}/task-collections/{collection_id}/runs/{run_id}:
    get:
      operationId: getTaskCollectionRun
      tags:
      - 任务组
      summary: 查询组运行详情
      description: 返回成员结果及脱敏共享参数；组配置删除后仍可查询。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      - $ref: '#/components/parameters/run_id'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
  /api/v1/projects/{project_id}/task-collections/{collection_id}/runs/{run_id}/overrides:
    get:
      operationId: listTaskCollectionOverrides
      tags:
      - 任务组
      summary: 查询参数覆盖记录
      description: 按 id 升序分页，含原始和新写入任务及运行 ID；不返回参数值。
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/collection_id'
      - $ref: '#/components/parameters/run_id'
      - $ref: rest-task.yaml#/components/parameters/Page
      - $ref: rest-task.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverridePage'
        '400':
          description: 请求或配置无效；启动校验失败不创建运行、不发送请求。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '409':
          description: 名称冲突、任务被引用或存在 queued/running 运行。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: rest-task.yaml#/components/schemas/Error
components:
  parameters:
    project_id:
      name: project_id
      in: path
      required: true
      description: 项目 ID
      schema:
        type: integer
        description: 项目 ID
        format: int32
        minimum: 1
        maximum: 2147483647
    collection_id:
      name: collection_id
      in: path
      required: true
      description: 任务组 ID，必须属于指定项目
      schema:
        type: integer
        description: 任务组 ID，必须属于指定项目
        format: int32
        minimum: 1
        maximum: 2147483647
    run_id:
      name: run_id
      in: path
      required: true
      description: 组运行 ID，必须属于指定项目及任务组
      schema:
        type: integer
        description: 组运行 ID，必须属于指定项目及任务组
        format: int32
        minimum: 1
        maximum: 2147483647
  schemas:
    Member:
      type: object
      description: 成员及执行批次；数组顺序不决定执行顺序。
      additionalProperties: false
      required:
      - task_id
      - position
      properties:
        task_id:
          type: integer
          description: 本项目任务 ID，同组不可重复
          format: int32
          minimum: 1
          maximum: 2147483647
        position:
          type: integer
          description: 正整数批次，可重复且不要求连续；同批并发。
          minimum: 1
          maximum: 2147483647
      example:
        task_id: 11
        position: 1
    CollectionInput:
      type: object
      description: 完整配置；允许空组草稿，运行时至少一个任务。
      additionalProperties: false
      required:
      - name
      - members
      properties:
        name: &id001
          type: string
          description: 去除首尾空白后项目内区分大小写唯一。
          minLength: 1
          maxLength: 120
        description: &id002
          type: string
          description: 任务组描述。
          maxLength: 2000
          default: ''
        base_url: &collection_base_url
          type: string
          nullable: true
          description: 可选的任务组运行地址；组运行时覆盖所有成员任务的 base_url。须为无凭据、query 或 fragment 的 HTTP/HTTPS 地址。
          minLength: 1
          format: uri
        datasource: &collection_datasource
          type: object
          nullable: true
          description: 可选的任务组 SQL 数据源；组运行时覆盖所有成员 SQL 节点的 driver、datasource、username、password，保留节点语句、参数及超时。
          additionalProperties: false
          required: [driver, datasource]
          properties:
            driver:
              type: string
              enum: [postgresql, sqlite]
            datasource:
              type: string
              minLength: 1
              description: PostgreSQL libpq 连接串或 URI；SQLite 文件路径。
            username:
              type: string
              description: 仅 PostgreSQL 使用。
            password:
              type: string
              format: password
              description: 仅 PostgreSQL 使用；读取时应脱敏。
        members: &id003
          type: array
          description: 成员任务必须来自同一项目；同一 task_id 不可重复。
          items:
            $ref: '#/components/schemas/Member'
          uniqueItems: true
      example:
        name: 登录与查询
        description: ''
        members: &id004
        - task_id: 11
          position: 1
        - task_id: 12
          position: 2
    Collection:
      type: object
      description: 任务组配置，成员按 position、task_id 升序返回。
      additionalProperties: false
      required:
      - name
      - description
      - members
      - id
      - project_id
      - created_at
      - updated_at
      properties:
        name: *id001
        description: *id002
        base_url: *collection_base_url
        datasource: *collection_datasource
        members: *id003
        id:
          type: integer
          description: 任务组 ID
          format: int32
          minimum: 1
          maximum: 2147483647
        project_id:
          type: integer
          description: 项目 ID
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          description: 创建时间。
          format: date-time
        updated_at:
          type: string
          description: 更新时间。
          format: date-time
      example: &id015
        name: 登录与查询
        description: ''
        members: *id004
        id: 1
        project_id: 1
        created_at: '2026-10-20T10:00:00Z'
        updated_at: '2026-10-20T10:00:00Z'
    RunMember:
      type: object
      description: 成员主流程及全部 finally 清理完成后才达到终态，期间保持 running。主流程 primary_error 一经持久化即阻止本批未开始成员；已运行成员继续自身主流程与清理。task_run_id 可查询阶段、主错误、清理状态与并发统计。
      additionalProperties: false
      required:
      - task_id
      - position
      - task_run_id
      - status
      properties:
        task_id:
          type: integer
          description: 任务 ID 快照
          format: int32
          minimum: 1
          maximum: 2147483647
        position:
          type: integer
          description: 批次快照。
          minimum: 1
        task_run_id:
          type: integer
          description: 本次独立任务运行 ID
          format: int32
          minimum: 1
          maximum: 2147483647
        status:
          type: string
          description: 成员状态；清理结束前保持 running，主流程成功但清理失败也为 failed。
          enum:
          - pending
          - running
          - succeeded
          - failed
          - skipped
          - blocked
      example: &id014
        task_id: 11
        position: 1
        task_run_id: 100
        status: pending
    Parameter:
      type: object
      description: 已提交的共享参数；敏感值为 ***，JSON null 是合法值。
      additionalProperties: false
      required:
      - name
      - value
      - value_type
      - sensitive
      - source_task_id
      - source_run_id
      properties:
        name:
          type: string
          description: 参数名称。
        value:
          description: JSON 类型参数值，敏感值统一返回字符串 ***。
          nullable: true
        value_type:
          type: string
          description: 原始类型。
          enum:
          - string
          - integer
          - number
          - boolean
          - object
          - array
        sensitive:
          type: boolean
          description: 敏感标记，覆盖合并采用逻辑或。
        source_task_id:
          type: integer
          description: 最近写入任务 ID
          format: int32
          minimum: 1
          maximum: 2147483647
        source_run_id:
          type: integer
          description: 最近写入任务运行 ID
          format: int32
          minimum: 1
          maximum: 2147483647
      example:
        name: token
        value: '***'
        value_type: string
        sensitive: true
        source_task_id: 11
        source_run_id: 100
    Override:
      type: object
      description: 覆盖审计，对应一条 ERROR 日志，不暴露参数值。
      additionalProperties: false
      required:
      - id
      - parameter_name
      - old_task_id
      - old_task_run_id
      - new_task_id
      - new_task_run_id
      - created_at
      properties:
        id:
          type: integer
          description: 审计 ID
          format: int32
          minimum: 1
          maximum: 2147483647
        parameter_name:
          type: string
          description: 被覆盖的参数名称。
        old_task_id:
          type: integer
          description: 原始写入任务
          format: int32
          minimum: 1
          maximum: 2147483647
        old_task_run_id:
          type: integer
          description: 原始任务运行
          format: int32
          minimum: 1
          maximum: 2147483647
        new_task_id:
          type: integer
          description: 新写入任务
          format: int32
          minimum: 1
          maximum: 2147483647
        new_task_run_id:
          type: integer
          description: 新任务运行
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          description: 覆盖发生时间。
          format: date-time
      example: &id017
        id: 1
        parameter_name: token
        old_task_id: 11
        old_task_run_id: 100
        new_task_id: 12
        new_task_run_id: 101
        created_at: '2026-10-20T10:00:01Z'
    Run:
      type: object
      description: 任务组运行摘要。
      additionalProperties: false
      required:
      - id
      - collection_id
      - project_id
      - status
      - created_at
      - started_at
      - finished_at
      - error_code
      - error_message
      properties:
