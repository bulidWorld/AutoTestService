# Design-first: 阶段二契约，业务实现前先维护此文件。
openapi: 3.0.3
info:
  title: AutoTestService Task API
  version: 0.3.0
  description: 阶段二任务编排与基础执行契约；依赖 rest-project.yaml 的项目及接口资产。字段取值、关联、唯一性及状态约束由业务校验。保存和运行前进行校验；仅支持全局
    REST 参数响应提取，无步骤响应提取、实时推送、重试或并行步骤。敏感数据在页面、API 及日志脱敏。
paths:
  /api/v1/projects/{project_id}/tasks:
    get:
      operationId: listTasks
      tags:
      - 任务管理
      summary: 任务列表
      description: 按名称不区分大小写包含搜索，按 updated_at 降序、id 升序分页。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: query
        description: 名称包含搜索，空字符串不筛选。
        schema:
          type: string
          description: 搜索词
          example: 订单
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTask
      tags:
      - 任务管理
      summary: 创建任务
      description: 原子保存参数和有序步骤；草稿允许没有步骤。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '201':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 完整保存任务配置，步骤与参数原子替换；草稿可无步骤。保存校验必填、类型、引用及本项目版本归属；步骤数组顺序用于排序，复制省略
          id。接口默认值仅首次填入，可修改。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
  /api/v1/projects/{project_id}/tasks/{task_id}:
    get:
      operationId: getTask
      tags:
      - 任务管理
      summary: 任务详情
      description: 返回参数、步骤、文件名、固定版本、方法及路径；发现新版本仅提示。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTask
      tags:
      - 任务管理
      summary: 保存任务及步骤排序
      description: 完整替换参数和步骤；保留已有步骤 ID，新步骤分配 ID。同一接口可重复添加。显式重新选择版本后校验绑定。锁定任务行协调保存和启动；运行中允许编辑，历史快照不受影响。
        当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 完整保存任务配置，步骤与参数原子替换；草稿可无步骤。保存校验必填、类型、引用及本项目版本归属；步骤数组顺序用于排序，复制省略
          id。接口默认值仅首次填入，可修改。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
    delete:
      operationId: deleteTask
      tags:
      - 任务管理
      summary: 删除任务
      description: confirm=true 代表页面二次确认。事务内锁定任务行检查 queued/running，依次清理请求、运行参数、运行步骤、运行、任务步骤、参数及任务。
        当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/copy:
    post:
      operationId: copyTask
      tags:
      - 任务管理
      summary: 复制任务
      description: 复制到同一项目，新任务及全部步骤分配新 ID；同步重映射 REST 参数的 step_id。复制来源配置和版本绑定，不复制运行历史、预览值或运行结果。当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '201':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 复制到同一项目；名称必填且唯一，参数和版本绑定复制，任务及步骤分配新 ID，不复制运行历史。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTask'
  /api/v1/projects/{project_id}/tasks/{task_id}/deletion-preview:
    get:
      operationId: previewTaskDeletion
      tags:
      - 任务管理
      summary: 删除影响预览
      description: 显示关联运行及请求数量；有未结束运行时禁止删除。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionPreview'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/validate:
    post:
      operationId: validateTask
      tags:
      - 任务管理
      summary: 校验任务
      description: 只做静态校验，不调用接口：校验必填、类型、版本归属及 REST step_id 归属，禁止不存在或移除的步骤、循环及源步骤首次执行前未就绪的参数依赖。错误返回
        valid=false 与 issues。run 模式至少一个步骤。当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 校验已保存配置；save 允许无步骤，run 至少一个步骤。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTask'
  /api/v1/projects/{project_id}/tasks/{task_id}/runs:
    post:
      operationId: startTaskRun
      tags:
      - 任务运行
      summary: 运行任务
      description: 先静态校验配置、step_id 本任务归属、参数依赖及提取表达式；失败 400，不发请求。锁定任务行，queued/running
        存在则 409；事务保存不可变配置快照、运行步骤及参数结果，返回 202。先初始化 fixed 参数，再按步骤序号发送请求；每步完成后执行绑定表达式并赋值全局参数，后续步骤只能引用已赋值的参数。同一步骤只请求一次，多个参数共享响应。
        无并行、重试或自动重定向。每步发送前提交请求记录，发送后保存响应；HTTP
        2xx 才成功。HTTP 错误、连接失败、超时、非 JSON、字段缺失、null 或提取类型错误导致运行失败，未执行参数及步骤跳过；提取失败同时将源运行步骤标记
        failed。不同任务独立运行，关闭页面不终止执行。重启将未结束运行和正在执行的参数/步骤标记 EXECUTION_INTERRUPTED，未执行项跳过，不续跑。地址前缀正确拼接，path/query
        编码，query 数组重复键，对象 query 拒绝，JSON 保留结构。当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listTaskRuns
      tags:
      - 任务运行
      summary: 运行历史
      description: 按 created_at 降序、id 降序分页；任务或 YAML 更新不改变历史。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        description: 可选状态筛选。
        schema:
          type: string
          description: 运行状态
          example: queued
          enum:
          - queued
          - running
          - succeeded
          - failed
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/runs/{run_id}:
    get:
      operationId: getTaskRun
      tags:
      - 任务运行
      summary: 运行详情
      description: 返回脱敏的不可变快照和步骤状态，支持手动刷新。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/runs/{run_id}/requests:
    get:
      operationId: listRunRequests
      tags:
      - 任务运行
      summary: 运行请求记录
      description: 先按阶段(parameters、steps)，再按 position、id 升序分页；执行前已经持久化的请求可查询，尚无响应的字段为
        null。跳过步骤无请求记录。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/tasks/{task_id}/runs/{run_id}/requests/{request_id}:
    get:
      operationId: getRunRequest
      tags:
      - 任务运行
      summary: 请求详情
      description: 返回方法、实际 URL、请求与响应头体、状态码、时间、耗时及可区分的错误原因，全部经过脱敏。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: 请求无效或配置校验失败，issues 定位具体字段；不发送测试请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或归属不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务名冲突、活动运行冲突或关联状态不允许操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      description: 统一错误响应；不暴露内部堆栈、密码或 Token。业务接口使用 code 和 issues 提供定位信息，系统基础接口至少返回
        detail。
      required:
      - detail
      properties:
        detail:
          type: string
          description: 错误说明
          example: 内部服务错误
        code:
          type: string
          description: 稳定错误码，例如 PROJECT_NAME_CONFLICT、INVALID_YAML、UNSUPPORTED_SCHEMA、RESOURCE_NOT_FOUND。
          example: INVALID_YAML
        issues:
          type: array
          description: 字段级错误明细，没有字段错误时为空。
          example:
          - location: /paths/~1orders/post/requestBody
            reason: 暂不支持 text/plain 请求体
          items:
            $ref: '#/components/schemas/ValidationIssue'
      example:
        detail: YAML 校验失败
        code: UNSUPPORTED_SCHEMA
        issues:
        - location: /paths/~1orders/post/requestBody
          reason: 暂不支持 text/plain 请求体
    ValidationIssue:
      type: object
      description: 单项校验错误，定位 YAML 字段、接口路径或请求参数。
      example:
        location: /paths/~1orders/post/requestBody
        reason: 暂不支持 text/plain 请求体
      properties:
        location:
          type: string
          description: 出错位置；YAML 使用 JSON Pointer，请求使用 body.name 等字段路径。
          example: /paths/~1orders/post/requestBody
        reason:
          type: string
          description: 可读错误原因，不包含凭据或内部堆栈。
          example: 暂不支持 text/plain 请求体
      required:
      - location
      - reason
    StepInput:
      type: object
      description: 步骤配置；数组顺序决定执行顺序，id 存在时保留稳定 ID，新增或复制步骤省略 id。interface_id/file_id/version
        必须指向本项目同一接口版本。 引用初始化步骤需先保存任务以获得稳定 ID，再配置 REST 参数。删除一个被参数引用的步骤必须在同次完整保存中移除或改绑所有引用，否则拒绝。
      properties:
        id:
          type: integer
          description: 已有步骤稳定 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        interface_id:
          type: integer
          description: 版本内接口 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        file_id:
          type: integer
          description: 逻辑 YAML 文件 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        version:
          type: integer
          description: 显式绑定版本
          example: 1
          minimum: 1
        bindings:
          type: array
          description: 参数、认证 header 和 JSON 字段绑定；可选字段未配置则不发送。
          items:
            $ref: 'rest-parameter.yaml#/components/schemas/FieldBindingEdit'
          example: []
      required:
      - interface_id
      - file_id
      - version
      - bindings
      example:
        interface_id: 1
        file_id: 1
        version: 1
        bindings: []
      additionalProperties: false
    Step:
      type: object
      description: 步骤详情；新版本提示仅展示，不自动替换绑定。敏感字面值省略 value，编辑时同一稳定步骤同一字段省略 value 可保留原值。
      properties:
        id:
          type: integer
          description: 已有步骤稳定 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        interface_id:
          type: integer
          description: 版本内接口 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        file_id:
          type: integer
          description: 逻辑 YAML 文件 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        version:
          type: integer
          description: 显式绑定版本
          example: 1
          minimum: 1
        bindings:
          type: array
          description: 脱敏后的字段绑定。
          example: []
          items:
            $ref: 'rest-parameter.yaml#/components/schemas/FieldBindingView'
        position:
          type: integer
          description: 展示序号
          example: 1
          minimum: 1
        file_name:
          type: string
          description: 逻辑文件名
          example: 订单接口
        current_version:
          type: integer
          description: 文件当前版本
          example: 2
          minimum: 1
        has_new_version:
          type: boolean
          description: 是否有新版本
          example: true
        method:
          type: string
          description: 方法
          example: GET
        path:
          type: string
          description: 接口路径
          example: /orders/{id}
        execution_phase:
          type: string
          enum:
          - parameters
          - steps
          description: 由全局参数引用关系推导：被引用步骤为 parameters，其他为 steps；客户端不写入。
          example: steps
      required:
      - id
      - interface_id
      - file_id
      - version
      - bindings
      - position
      - file_name
      - current_version
      - has_new_version
      - method
      - path
      - execution_phase
      example:
        id: 1
        interface_id: 1
        file_id: 1
        version: 1
        bindings: []
        position: 1
        file_name: 订单接口
        current_version: 2
        has_new_version: true
        method: GET
        path: /orders/{id}
        execution_phase: steps
    TaskWrite:
      type: object
      description: 原子保存完整任务配置，参数及步骤数组决定各自顺序。REST 来源仅保存本任务的稳定 step_id 和表达式，复用步骤的接口版本与绑定。新步骤先保存获得
        ID，再配置 REST 引用；复制任务时重建全部步骤 ID 并映射参数引用。所有步骤按步骤数组顺序执行一次，每步完成后提取其绑定参数。参数引用的初始化步骤只能使用该步骤首次执行前已初始化的全局参数，拒绝自身、后序依赖及循环；同一步骤可供多个参数提取同一次响应，不重新请求。绑定失败或提取失败导致运行失败；静态校验不发请求。删除被引用步骤必须同时解除或改绑引用。至少有一个步骤才允许运行；全部请求及表达式赋值成功则运行成功。
      properties:
        name:
          type: string
          description: 项目内唯一名称，去除首尾空白
          example: 订单流程
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: 任务描述
          example: 订单回归
          maxLength: 2000
          default: ''
        base_url:
          type: string
          description: HTTP/HTTPS 地址，可带路径前缀，禁止 query、fragment 和用户凭据
          example: https://api.example.com/service
        timeout_seconds:
          type: integer
          description: 每次请求超时秒数
          example: 30
          minimum: 1
          maximum: 300
          default: 30
        global_parameters:
          type: array
          description: 有序全局参数配置，支持 fixed/rest；名称唯一，步骤只能引用固定参数或前序步骤已赋值的参数。
          items:
            $ref: 'rest-parameter.yaml#/components/schemas/GlobalParameterEdit'
          example: []
        steps:
          type: array
          description: 有序步骤，允许为空
          items:
            $ref: '#/components/schemas/StepInput'
          example: []
      required:
      - name
      - base_url
      - global_parameters
      - steps
      example:
        name: 订单流程
        base_url: https://api.example.com/service
        timeout_seconds: 30
        global_parameters: []
        steps: []
      additionalProperties: false
    Task:
      type: object
      description: 任务详情，返回参数到步骤的引用及推导的执行阶段；敏感值脱敏，已有值保留规则见 TaskWrite。
