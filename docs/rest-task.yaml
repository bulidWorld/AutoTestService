          description: HTTP/HTTPS 地址，可带路径前缀，禁止 query、fragment 和用户凭据
          example: https://api.example.com/service
        timeout_seconds:
          type: integer
          description: 每次请求超时秒数
          example: 30
          minimum: 1
          maximum: 300
          default: 30
        global_parameters:
          type: array
          description: 有序全局参数配置，支持 fixed/rest；名称唯一，步骤只能引用固定参数或前序步骤已赋值的参数。
          items:
            $ref: 'rest-parameter.yaml#/components/schemas/GlobalParameter'
          example: []
        steps:
          type: array
