      description: HTTP 头；数组允许重复名称。
      properties:
        name:
          type: string
          description: 头名称
          example: Authorization
        value:
          type: string
          description: 脱敏后的值
          example: '***'
        redacted:
          type: boolean
          description: 是否脱敏
          example: true
      required:
      - name
      - value
      - redacted
      example:
        name: Authorization
        value: '***'
        redacted: true
    Request:
      type: object
      description: 每个请求关联实际执行的步骤；parameters 阶段步骤可被多个全局参数引用，请求只执行一次，参数结果通过 request_id
        关联同一响应。所有敏感参数、派生 URL/header/请求体/响应回显和错误需脱敏。Authorization/Cookie/Set-Cookie
        默认脱敏。
      properties:
        id:
          type: integer
          description: 请求记录 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        run_id:
          type: integer
          description: 运行 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        run_step_id:
          type: integer
          description: 运行步骤 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        step_id:
          type: integer
          description: 任务稳定步骤 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        position:
          type: integer
          description: 所属阶段的序号，先按 phase(parameters 在前) 再按 position 排序。
          example: 1
          minimum: 1
        method:
          type: string
          description: HTTP 方法
          example: GET
        actual_url:
          type: string
          description: 脱敏后的实际编码 URL
          example: https://api.example.com/service/orders/1
        request_headers:
          type: array
          description: 脱敏请求头
          items:
            $ref: '#/components/schemas/Header'
          example: []
        request_body:
          type: string
          description: 脱敏请求体文本，没有为 null
          example: null
          nullable: true
        response_status:
          type: integer
          description: 响应状态码，无响应为 null
          example: 200
          nullable: true
        response_headers:
          type: array
          description: 脱敏响应头，未收到响应为 null
          items:
            $ref: '#/components/schemas/Header'
          example: []
          nullable: true
        response_body:
          type: string
          description: 脱敏响应体，无响应为 null
          example: null
          nullable: true
        response_body_encoding:
          type: string
          description: 响应文本编码
          example: null
          nullable: true
          enum:
          - utf-8
          - base64
          - null
        started_at:
          type: string
          description: 开始时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
        finished_at:
          type: string
          description: 结束时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          description: 耗时毫秒，未结束为 null
          example: null
          format: int64
          nullable: true
          minimum: 0
        error_code:
          type: string
          description: 错误分类；服务重启遗留运行标记 EXECUTION_INTERRUPTED
          example: null
          nullable: true
        error_message:
          type: string
          description: 脱敏错误说明
          example: null
          nullable: true
        redacted:
          type: boolean
          description: 本记录是否有字段脱敏
          example: true
        phase:
          type: string
          description: 请求所属阶段
          example: parameters
          enum:
          - parameters
          - steps
        run_parameter_id:
          type: integer
          description: 兼容旧字段，新记录为 null；参数结果使用 request_id 关联请求。
          example: null
          format: int32
          nullable: true
          minimum: 1
      required:
      - id
      - run_id
      - run_step_id
      - step_id
      - position
      - method
      - actual_url
      - request_headers
      - request_body
      - response_status
      - response_headers
      - response_body
      - response_body_encoding
      - started_at
      - finished_at
      - duration_ms
      - error_code
      - error_message
      - redacted
      - phase
      - run_parameter_id
      example:
        id: 1
        run_id: 1
        run_step_id: 1
        step_id: 1
        position: 1
        method: GET
        actual_url: https://api.example.com/service/orders/1
        request_headers: []
        request_body: null
        response_status: 200
        response_headers: []
        response_body: null
        response_body_encoding: null
        started_at: '2026-10-13T07:00:00Z'
        finished_at: '2026-10-13T07:00:00Z'
        duration_ms: null
        error_code: null
        error_message: null
        redacted: true
        phase: steps
        run_parameter_id: null
    TaskPage:
      type: object
      description: 稳定分页，超出末页返回空 items。
      properties:
        items:
          type: array
          description: 本页记录
          items:
            $ref: '#/components/schemas/TaskSummary'
          example: []
        total:
          type: integer
          description: 总数
          example: 0
          minimum: 0
        page:
          type: integer
          description: 页码
          example: 1
          minimum: 1
        page_size:
          type: integer
          description: 每页数量
          example: 20
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - page_size
      example:
        items: []
        total: 0
        page: 1
        page_size: 20
    RunPage:
      type: object
      description: 稳定分页，超出末页返回空 items。
      properties:
        items:
          type: array
          description: 本页记录
          items:
            $ref: '#/components/schemas/Run'
          example: []
        total:
          type: integer
          description: 总数
          example: 0
          minimum: 0
        page:
          type: integer
          description: 页码
          example: 1
          minimum: 1
        page_size:
          type: integer
          description: 每页数量
          example: 20
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - page_size
      example:
        items: []
        total: 0
        page: 1
        page_size: 20
    RequestPage:
      type: object
      description: 稳定分页，超出末页返回空 items。
      properties:
        items:
          type: array
          description: 本页记录
          items:
            $ref: '#/components/schemas/Request'
          example: []
        total:
          type: integer
          description: 总数
          example: 0
          minimum: 0
        page:
          type: integer
          description: 页码
          example: 1
          minimum: 1
        page_size:
          type: integer
          description: 每页数量
          example: 20
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - page_size
      example:
        items: []
        total: 0
        page: 1
        page_size: 20
    DeletionPreview:
      type: object
      description: 删除任务影响预览；计数仅作提示，删除时锁定任务行并重新检查活动运行。
      properties:
        task_id:
          type: integer
          description: 任务 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        step_count:
          type: integer
          description: 步骤数
          example: 3
          minimum: 0
        run_count:
          type: integer
          description: 运行记录数
          example: 2
          minimum: 0
        request_count:
          type: integer
          description: 包括参数初始化和任务步骤的请求记录数量。
          example: 6
          minimum: 0
        can_delete:
          type: boolean
          description: 无 queued/running 才允许删除
          example: true
        blocking_reasons:
          type: array
          description: 阻止删除原因
          items:
            type: string
            description: 原因
            example: 存在未结束运行
          example: []
      required:
      - task_id
      - step_count
      - run_count
      - request_count
      - can_delete
      - blocking_reasons
      example:
        task_id: 1
        step_count: 3
        run_count: 2
        request_count: 6
        can_delete: true
        blocking_reasons: []
    DeletionResult:
      type: object
      description: 删除成功结果，删除关联数据后不可再访问；重复删除不存在的对象返回 404。
      example:
        id: 1
        deleted: true
      properties:
        id:
          type: integer
          description: 已删除对象 ID。 数据库自增整数。
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        deleted:
          type: boolean
          description: 删除完成。
          example: true
          enum:
          - true
      required:
      - id
      - deleted
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目唯一 ID；必须属于路径中的项目及文件，否则返回 404。
      schema:
        type: integer
        description: 项目 ID。 数据库自增整数。
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        description: 页码。
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，范围 1～100。
      schema:
        type: integer
        description: 每页条数。
        example: 20
        minimum: 1
        maximum: 100
        default: 20
    ConfirmDelete:
      name: confirm
      in: query
      required: true
      description: 页面展示影响范围并完成二次确认后显式传 true；缺失或 false 均不执行删除。
      schema:
        type: boolean
        description: 删除确认标记。
        example: true
        enum:
        - true
    TaskId:
      name: task_id
      in: path
      required: true
      description: 资源必须属于路径中的项目、任务及运行，否则返回 404。
      schema:
        type: integer
        description: task_id
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
    RunId:
      name: run_id
      in: path
      required: true
      description: 资源必须属于路径中的项目、任务及运行，否则返回 404。
      schema:
        type: integer
        description: run_id
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
    RequestId:
      name: request_id
      in: path
      required: true
      description: 资源必须属于路径中的项目、任务及运行，否则返回 404。
      schema:
        type: integer
        description: request_id
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
