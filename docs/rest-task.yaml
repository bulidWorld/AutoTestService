          example: []
        id:
          type: integer
          description: 任务 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        project_id:
          type: integer
          description: 项目 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          description: 创建时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
        updated_at:
          type: string
          description: 更新时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
          nullable: true
      required:
