# Design-first: 先维护此契约，再绑定 Python Handler。
openapi: 3.0.3
info:
  title: AutoTestService API
  version: 0.4.0
  description: 项目与接口资产管理、OpenAPI 3.0.x YAML 导入与版本浏览，以及输入参数进行接口单次测试。业务接口无需认证。任务编排与执行由
    rest-task.yaml 定义。
paths:
  /api/v1/health:
    get:
      summary: 进程健康检查
      description: 进程健康检查，初始化阶段无需认证。
      operationId: health
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: 无效请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - 系统
  /api/v1/ready:
    get:
      summary: 数据库就绪检查
      description: 数据库就绪检查，初始化阶段无需认证。
      operationId: ready
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: 无效请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
      - 系统
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
      - 项目
      summary: 查询项目列表
      description: 按名称不区分大小写包含搜索，未筛选时返回全部；按更新时间降序、ID 升序稳定分页。 当前阶段无需认证。
      parameters:
      - name: name
        in: query
        required: false
        description: 项目名称包含搜索，空字符串表示不筛选。
        schema:
          type: string
          description: 名称搜索词。
          example: 订单系统
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      tags:
      - 项目
      summary: 新建项目
      description: 名称系统内唯一；持久化成功后返回项目摘要。 当前阶段无需认证。
      parameters: []
      responses:
        '201':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 名称冲突或删除受到运行/引用约束。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 项目名称及可选描述。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      tags:
      - 项目
      summary: 查询项目详情
      description: 返回项目及所属 YAML 文件摘要，统计当前版本接口。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateProject
      tags:
      - 项目
      summary: 编辑项目
      description: 仅更新提交字段；名称冲突时完整回滚，不改变描述或更新时间。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 名称冲突或删除受到运行/引用约束。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: 项目部分更新字段。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
    delete:
      operationId: deleteProject
      tags:
      - 项目
      summary: 确认删除项目
      description: 必须 confirm=true；事务内重新校验，删除项目及所有关联文件、历史版本、接口。后续任务/运行数据纳入关联删除，运行中项目拒绝删除。
        当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 名称冲突或删除受到运行/引用约束。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/deletion-preview:
    get:
      operationId: previewProjectDeletion
      tags:
      - 项目
      summary: 查询项目删除影响
      description: 统计将删除的文件、全部版本、接口及后续任务记录；存在运行中任务时禁止删除。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionPreview'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/yaml-files:
    get:
      operationId: listYamlFiles
      tags:
      - YAML 文件
      summary: 查询项目 YAML 文件
      description: 展示当前版本及接口数；按更新时间降序、ID 升序稳定分页。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YamlFilePage'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: importYamlFile
      tags:
      - YAML 文件
      summary: 导入 YAML 文件
      description: 逻辑名项目内唯一；原始内容、版本 1 和全部接口一次性保存。支持文件内 components 引用和嵌套基础 Schema；失败不创建部分数据。
        当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '201':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 名称冲突或删除受到运行/引用约束。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 上传文件超过 5 MiB，未保存任何导入数据。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: multipart/form-data 上传；先完整解析校验，再原子写入。不能把文件路径作为 JSON 字符串提交。
        content:
          multipart/form-data:
            schema:
              type: object
              description: 上传字段。
              example:
                file: orders.yaml
                name: 订单接口
              properties:
                name:
                  type: string
                  description: 逻辑文件名；首尾空白去除后不能为空，项目内区分大小写唯一。
                  example: 订单接口
                  minLength: 1
                  maxLength: 120
                file:
                  type: string
                  description: UTF-8 的 .yaml/.yml 文件，OpenAPI 3.0.x，上限 5 MiB。拒绝空文件、无接口、外部引用、组合
                    Schema、cookie 参数及 JSON/multipart 以外的请求体。文件大小按实际字节计。
                  example: orders.yaml
                  format: binary
              required:
              - name
              - file
              additionalProperties: false
