  /api/v1/projects/{project_id}/yaml-files/{file_id}/interfaces/{interface_id}/test:
    post:
      operationId: testInterface
      tags:
      - 接口
      summary: 接口单次测试
      description: 选择指定版本接口，输入参数后进行单次测试。方法和路径不能从请求覆盖；校验完成后只发送一次。HTTP 2xx 为成功，其他状态、超时或连接错误为失败；敏感参数、认证头及响应回显脱敏。当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/InterfaceId'
      requestBody:
        required: true
        description: 对选定的不可变接口版本执行一次；方法和路径从接口资产读取。地址允许路径前缀，不允许 query、fragment 或用户凭据；不创建任务或任务运行。支持
          path/query/header 和 JSON 请求体；multipart 执行明确拒绝。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterfaceTestInput'
      responses:
        '200':
          description: 单次测试完成，status 表示目标请求是否成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceTestResult'
        '400':
          description: 参数、地址、类型或执行媒体类型无效，issues 定位字段；不发送请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 接口不存在或不属于路径指定的项目及文件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误，返回脱敏说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      description: 服务可用状态
      required:
      - status
      properties:
        status:
          type: string
          description: ok 或 unavailable
          example: ok
      example:
        status: ok
    Error:
      type: object
      description: 统一错误响应；不暴露内部堆栈、密码或 Token。业务接口使用 code 和 issues 提供定位信息，系统基础接口至少返回
        detail。
      required:
      - detail
      properties:
        detail:
          type: string
          description: 错误说明
          example: 内部服务错误
        code:
          type: string
          description: 稳定错误码，例如 PROJECT_NAME_CONFLICT、INVALID_YAML、UNSUPPORTED_SCHEMA、RESOURCE_NOT_FOUND。
          example: INVALID_YAML
        issues:
          type: array
          description: 字段级错误明细，没有字段错误时为空。
          example:
          - location: /paths/~1orders/post/requestBody
            reason: 暂不支持 text/plain 请求体
          items:
            $ref: '#/components/schemas/ValidationIssue'
      example:
        detail: YAML 校验失败
        code: UNSUPPORTED_SCHEMA
        issues:
        - location: /paths/~1orders/post/requestBody
          reason: 暂不支持 text/plain 请求体
    ProjectCreate:
      type: object
      description: 创建项目请求。
      example:
        name: 订单接口测试
        description: 订单接口自动化测试项目
      properties:
        name:
          type: string
          description: 项目名称；去除首尾空白后不能为空、最多 120 字符；系统内区分大小写唯一。
          example: 订单接口测试
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: 项目描述，最多 2000 字符；创建时未提供默认为空字符串。
          example: 订单接口自动化测试项目
          maxLength: 2000
          default: ''
      required:
      - name
      additionalProperties: false
    ProjectUpdate:
      type: object
      description: 部分更新项目；至少提交一个字段，未提供的字段保持原值。
      example:
        name: 订单接口回归测试
      properties:
        name:
          type: string
          description: 项目名称；去除首尾空白后不能为空、最多 120 字符；系统内区分大小写唯一。
          example: 订单接口测试
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: 项目描述，最多 2000 字符；创建时未提供默认为空字符串。
          example: 订单接口自动化测试项目
          maxLength: 2000
          default: ''
      additionalProperties: false
      minProperties: 1
    Project:
      type: object
      description: 项目摘要；接口数量只统计各文件当前版本，不累计历史版本。
      example:
        id: 1
        name: 订单接口测试
        description: 订单接口自动化测试项目
        created_at: '2026-10-13T07:00:00Z'
        updated_at: '2026-10-13T07:00:00Z'
        yaml_file_count: 1
        interface_count: 2
      properties:
        id:
          type: integer
          description: 项目唯一 ID。 数据库自增整数。
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        name:
          type: string
          description: 项目名称；去除首尾空白后不能为空、最多 120 字符；系统内区分大小写唯一。
          example: 订单接口测试
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: 项目描述，最多 2000 字符；创建时未提供默认为空字符串。
          example: 订单接口自动化测试项目
          maxLength: 2000
          default: ''
        created_at:
          type: string
          description: 创建时间，RFC 3339 UTC 时间。
          example: '2026-10-13T07:00:00Z'
          format: date-time
        updated_at:
          type: string
          description: 项目属性最后更新时间，RFC 3339 UTC 时间。
          example: '2026-10-13T07:00:00Z'
          format: date-time
        yaml_file_count:
          type: integer
          description: 项目所属逻辑 YAML 文件数量。
          example: 1
          minimum: 0
        interface_count:
          type: integer
          description: 所有文件当前版本的接口总数。
          example: 2
          minimum: 0
      required:
      - id
      - name
      - description
      - created_at
      - updated_at
      - yaml_file_count
      - interface_count
    YamlFile:
      type: object
      description: 稳定的逻辑文件记录；更新 YAML 后文件 ID 保持不变，切换当前版本。
      example:
        id: 1
