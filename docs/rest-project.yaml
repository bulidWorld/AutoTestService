        '500':
          description: 内部错误；事务回滚，既有数据保留。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteYamlFile
      tags:
      - YAML 文件
      summary: 确认删除 YAML 文件
      description: 必须 confirm=true，删除文件、全部版本及接口；被任务引用时返回 409。 当前阶段无需认证。
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
        '400':
          description: 请求参数或删除确认无效。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
                type: string
                description: 请求关联 ID。
                example: a6c2d4e8f0914b1aa2957c6e4b36e003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 名称冲突或删除受到运行/引用约束。
          headers:
            X-Request-ID:
              description: 本次请求的关联 ID，用于查找脱敏日志。
              schema:
