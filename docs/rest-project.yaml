          example: true
        blocking_reasons:
          type: array
          description: 阻止删除的可读原因；可删除时为空。
          example: []
          items:
            type: string
            description: 一条删除限制。
            example: 存在运行中的任务
      required:
      - target_id
      - yaml_file_count
      - version_count
      - interface_count
      - task_count
      - run_count
      - can_delete
      - blocking_reasons
    DeletionResult:
      type: object
      description: 删除成功结果，删除关联数据后不可再访问；重复删除不存在的对象返回 404。
      example:
        id: 1
        deleted: true
      properties:
        id:
          type: integer
          description: 已删除对象 ID。 数据库自增整数。
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        deleted:
          type: boolean
          description: 删除完成。
          example: true
          enum:
          - true
      required:
      - id
      - deleted
    ValidationIssue:
      type: object
      description: 单项校验错误，定位 YAML 字段、接口路径或请求参数。
      example:
        location: /paths/~1orders/post/requestBody
        reason: 暂不支持 text/plain 请求体
      properties:
        location:
          type: string
          description: 出错位置；YAML 使用 JSON Pointer，请求使用 body.name 等字段路径。
          example: /paths/~1orders/post/requestBody
        reason:
          type: string
          description: 可读错误原因，不包含凭据或内部堆栈。
          example: 暂不支持 text/plain 请求体
      required:
      - location
      - reason
    InterfaceTestParameter:
      type: object
      description: 单次测试参数，值直接按接口 Schema 校验，保持 JSON 类型；未填写的可选参数不发送。header 允许额外认证头，禁止覆盖方法、地址、Host
        等执行配置。
      properties:
        location:
          type: string
          description: 参数位置
          example: path
          enum:
          - path
          - query
          - header
        name:
          type: string
          description: 参数名称
          example: order_id
          minLength: 1
        value:
          description: JSON 类型参数值：string/integer/number/boolean/object/array，必须符合接口
            Schema；不支持 null。
          example: 10
        sensitive:
          type: boolean
          description: 是否隐藏该参数及响应回显；认证头默认隐藏
          example: false
          default: false
      required:
      - location
      - name
      - value
      example:
        location: path
        name: order_id
        value: 10
        sensitive: false
      additionalProperties: false
    InterfaceTestInput:
      type: object
      description: 对选定的不可变接口版本执行一次；方法和路径从接口资产读取。地址允许路径前缀，不允许 query、fragment 或用户凭据；不创建任务或任务运行。支持
        path/query/header 和 JSON 请求体；multipart 执行明确拒绝。
      properties:
        base_url:
          type: string
          description: HTTP/HTTPS 测试地址
          example: https://api.example.com/service
        timeout_seconds:
          type: integer
          description: 请求超时秒数
          example: 30
          minimum: 1
          maximum: 300
          default: 30
        parameters:
          type: array
          description: 输入的参数及认证头；query 数组使用重复键，对象 query 拒绝。
          items:
            $ref: '#/components/schemas/InterfaceTestParameter'
          example:
          - location: path
            name: order_id
            value: 10
        request_body:
          description: 完整 JSON 请求体，保持对象及数组结构；没有请求体时省略此字段，不传 null。
          example:
            name: demo
        body_sensitive:
          type: boolean
          description: 是否隐藏整个请求体及响应体
          example: false
          default: false
      required:
      - base_url
      - parameters
      example:
        base_url: https://api.example.com/service
        timeout_seconds: 30
        parameters:
        - location: path
          name: order_id
          value: 10
      additionalProperties: false
    TestHeader:
      type: object
      description: 请求或响应头，重复头保持多条记录；Authorization/Cookie/Set-Cookie 默认脱敏。
      properties:
        name:
          type: string
          description: 头名称
          example: Authorization
        value:
          type: string
          description: 脱敏后的值
          example: '***'
        redacted:
          type: boolean
          description: 是否隐藏头值
          example: true
      required:
      - name
      - value
      - redacted
      example:
        name: Authorization
        value: '***'
        redacted: true
      additionalProperties: false
    InterfaceTestResult:
      type: object
      description: 单次测试详情。调用完成后 HTTP 200 返回执行结果，远端非 2xx、超时及连接错误通过 status/error_code
        区分；不自动重试或跟随重定向。仅返回本次结果，不保存任务或运行历史。
      properties:
        project_id:
          type: integer
          description: 项目 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        file_id:
          type: integer
          description: 文件 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        interface_id:
          type: integer
          description: 不可变版本接口 ID
          example: 1
          format: int32
          minimum: 1
          maximum: 2147483647
        version:
          type: integer
          description: 实际使用的 YAML 版本
          example: 1
          minimum: 1
        status:
          type: string
          description: 本次测试结果
          example: succeeded
          enum:
          - succeeded
          - failed
        method:
          type: string
          description: 从接口资产读取的 HTTP 方法
          example: GET
        actual_url:
          type: string
          description: 脱敏的实际编码 URL
          example: https://api.example.com/service/orders/10
        request_headers:
          type: array
          description: 脱敏请求头
          items:
            $ref: '#/components/schemas/TestHeader'
          example: []
        request_body:
          type: string
          description: 脱敏请求体文本，无请求体为 null
          example: null
          nullable: true
        response_status:
          type: integer
          description: 目标 HTTP 状态码，无响应为 null
          example: 200
          nullable: true
        response_headers:
          type: array
          description: 脱敏响应头，无响应为 null
          items:
            $ref: '#/components/schemas/TestHeader'
          nullable: true
          example: []
        response_body:
          type: string
          description: 脱敏响应体，无响应为 null
          example: '{"data":{"a":1}}'
          nullable: true
        response_body_encoding:
          type: string
          description: 响应体编码，无响应为 null
          example: utf-8
          nullable: true
          enum:
          - utf-8
          - base64
          - null
        started_at:
          type: string
          description: 开始时间
          example: '2026-10-13T07:00:00Z'
          format: date-time
        finished_at:
          type: string
          description: 结束时间
          example: '2026-10-13T07:00:01Z'
          format: date-time
        duration_ms:
          type: integer
          description: 耗时毫秒
          example: 1000
          format: int64
          minimum: 0
        error_code:
          type: string
          description: HTTP_STATUS_ERROR/CONNECTION_ERROR/TIMEOUT，成功为 null
          example: null
          nullable: true
        error_message:
          type: string
          description: 脱敏错误原因，成功为 null
          example: null
          nullable: true
        redacted:
          type: boolean
          description: 是否有字段脱敏
          example: false
      required:
      - project_id
      - file_id
      - interface_id
      - version
      - status
      - method
      - actual_url
      - request_headers
      - request_body
      - response_status
      - response_headers
      - response_body
      - response_body_encoding
      - started_at
      - finished_at
      - duration_ms
      - error_code
      - error_message
      - redacted
      example:
        project_id: 1
        file_id: 1
        interface_id: 1
        version: 1
        status: succeeded
        method: GET
        actual_url: https://api.example.com/service/orders/10
        request_headers: []
        request_body: null
        response_status: 200
        response_headers: []
        response_body: '{"data":{"a":1}}'
        response_body_encoding: utf-8
        started_at: '2026-10-13T07:00:00Z'
        finished_at: '2026-10-13T07:00:01Z'
        duration_ms: 1000
        error_code: null
        error_message: null
        redacted: false
      additionalProperties: false
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目唯一 ID；必须属于路径中的项目及文件，否则返回 404。
      schema:
        type: integer
        description: 项目 ID。 数据库自增整数。
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
    FileId:
      name: file_id
      in: path
      required: true
      description: 逻辑文件唯一 ID；必须属于路径中的项目及文件，否则返回 404。
      schema:
        type: integer
        description: 逻辑文件 ID。 数据库自增整数。
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
    InterfaceId:
      name: interface_id
      in: path
      required: true
      description: 接口唯一 ID；必须属于路径中的项目及文件，否则返回 404。
      schema:
        type: integer
        description: 接口 ID。 数据库自增整数。
        example: 1
        format: int32
        minimum: 1
        maximum: 2147483647
    VersionNumber:
      name: version_number
      in: path
      required: true
      description: 该逻辑文件的历史版本号，从 1 开始。
      schema:
        type: integer
        description: 版本号。
        example: 1
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        description: 页码。
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，范围 1～100。
      schema:
        type: integer
        description: 每页条数。
        example: 20
        minimum: 1
        maximum: 100
        default: 20
    ConfirmDelete:
      name: confirm
      in: query
      required: true
      description: 页面展示影响范围并完成二次确认后显式传 true；缺失或 false 均不执行删除。
      schema:
        type: boolean
        description: 删除确认标记。
        example: true
        enum:
        - true
tags:
- name: 系统
  description: 进程健康及数据库就绪检查
- name: 项目
  description: 项目创建、搜索、编辑、详情及关联删除
- name: YAML 文件
  description: 逻辑文件导入、列表、详情和删除
- name: YAML 版本
  description: 不可变历史版本及脱敏原始内容
- name: 接口
  description: 按版本浏览接口参数、请求体和响应定义
